<style>
:root{
  color-scheme:light;
  --bg:#D9A11A; --bg-deep:#C48E0E;
  --panel:#FFF5DA; --panel-soft:#FFFBEF;
  --ink:#111008; --ink-2:#2B2410; --ink-3:#5A4A1A;
  --red:#9C2B17; --red-soft:#FBE3D9;
  --green:#1E5B2E; --green-soft:#E3F0DC;
  --display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --body:"Nunito Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html[dir="rtl"]{--display:"Amiri","Traditional Arabic",serif;--body:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden}
body{font-family:var(--body);font-size:16px;line-height:1.55;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 48px) max(16px,env(safe-area-inset-left,0px))}
html[dir="rtl"] body{line-height:1.75}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
html[dir="rtl"] h1,html[dir="rtl"] h2{font-weight:700;line-height:1.3}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* En-tête */
header.top{background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:16px 18px;display:grid;gap:12px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{width:60px;height:60px;border-radius:50%;flex:none;border:2px solid var(--ink)}
.brand h1{font-size:clamp(1.8rem,6vw,2.9rem)}
.brand h1 i{font-style:italic}
html[dir="rtl"] .brand h1 i{font-style:normal}
.brand p{margin:4px 0 0;font-weight:600;color:var(--ink-2);font-size:.92rem;line-height:1.4}
.hbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.langs{display:flex;gap:4px;background:var(--panel-soft);border:2px solid var(--ink);padding:3px;border-radius:999px}
.langs button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-family:"Nunito Sans",sans-serif;font-weight:800;font-size:.85rem;cursor:pointer;min-width:48px;min-height:32px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.langs button[data-lang="ar"]{display:inline-flex;align-items:center;justify-content:center;padding:3px 10px}
.ar-cal{display:block;width:46px;height:19px;background:currentColor;-webkit-mask:url(arabe-calligraphie.png) center/contain no-repeat;mask:url(arabe-calligraphie.png) center/contain no-repeat}
.install{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:8px 14px;font-weight:800;cursor:pointer;font-size:.9rem}

/* Onglets */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg-deep);border:2px solid var(--ink);border-radius:16px;padding:4px;margin-top:12px}
.tabs button{border:0;background:transparent;border-radius:12px;padding:9px 4px;font-weight:800;font-size:.92rem;cursor:pointer;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs .n{font-size:.72rem;font-weight:700;opacity:.8}
.tabs .n.hit{background:#FFE07A;color:var(--ink);border-radius:999px;padding:0 7px;opacity:1}

.intro{margin:12px 0 0;background:var(--panel-soft);border:2px solid var(--ink);border-radius:14px;padding:12px 16px;font-size:.88rem;line-height:1.5;color:var(--ink-2)}
html[dir="rtl"] .intro{font-size:.92rem;line-height:1.8}

/* Recherche */
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;display:grid;gap:8px}
.search{display:flex;align-items:center;gap:10px;background:var(--panel-soft);border:2px solid var(--ink);border-radius:14px;padding:0 14px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;font-weight:600;font-size:16px}
.search input:focus{outline:none}
.search input::placeholder{color:var(--ink-3)}
.search .clear{border:0;background:var(--bg-deep);border-radius:999px;width:28px;height:28px;font-weight:800;cursor:pointer;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:2px solid var(--ink);background:var(--panel-soft);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.88rem;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips .sep{flex:none;width:2px;background:var(--ink);opacity:.25;margin:4px 2px;border-radius:2px}
.status{display:flex;align-items:center;gap:10px;min-height:34px}
.back{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:4px 14px 4px 10px;font-weight:800;font-size:.88rem;cursor:pointer}
.back svg{width:16px;height:16px;flex:none}
html[dir="rtl"] .back{padding:4px 10px 4px 14px}
html[dir="rtl"] .back svg,html[dir="rtl"] .jump svg{transform:scaleX(-1)}
.count{margin:0;font-weight:700;font-size:.9rem;color:var(--ink-2)}

/* Cases */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px;align-items:start;margin-top:4px}
.item{background:var(--panel);border:2px solid var(--ink);border-radius:16px;overflow:hidden;scroll-margin-top:170px}
.ihead{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:2px solid var(--ink);background:var(--panel-soft)}
.badge{flex:none;width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:"DM Serif Display",Georgia,serif;font-size:1.6rem;line-height:1}
.badge.m{font-size:1.3rem}
.badge.l{font-size:1.1rem}
.item[data-cat="min"] .badge{background:#3B2A10;border:3px solid var(--bg)}
.item[data-cat="aa"] .badge{background:var(--green);color:#FFF5DA}
.ihead h2{font-size:1.45rem}
.ihead .chem{margin:2px 0 0;font-weight:700;color:var(--ink-3);font-size:.9rem;line-height:1.35}
.type{display:inline-block;margin-top:5px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px}
html[dir="rtl"] .type{letter-spacing:0;font-size:.78rem}
.type.lipo{background:#F6D27A}
.type.hydro{background:#CFE6F2}
.type.macro{background:#EAD3B5}
.type.oligo{background:#E4D8F0}
.type.ess{background:var(--green-soft)}
.ibody{padding:14px 16px 16px;display:grid;gap:12px}
.ibody h3{font-family:var(--body);font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;display:flex;align-items:center;gap:6px}
html[dir="rtl"] .ibody h3{letter-spacing:0;font-size:.9rem}
.ibody h3 svg{width:15px;height:15px;flex:none}
.ibody p{margin:0;color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:0;padding:0;list-style:none}
.tags li{background:var(--green-soft);color:var(--green);border:1px solid rgba(30,91,46,.3);border-radius:999px;padding:2px 10px;font-size:.88rem;font-weight:700}
.ill{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.ill li{background:var(--red-soft);border-inline-start:4px solid var(--red);border-radius:6px;padding:5px 10px;font-size:.92rem;color:var(--ink-2)}
.ill li b{color:var(--red)}
.note{font-size:.86rem;font-style:italic;color:var(--ink-3)}
html[dir="rtl"] .note{font-style:normal}
mark{background:#FFE07A;color:inherit;border-radius:3px;padding:0 1px}

.empty{background:var(--panel);border:2px solid var(--ink);border-radius:16px;padding:20px;text-align:center;font-weight:700;display:grid;gap:10px;justify-items:center}
.jumps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.jump{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--bg);border-radius:999px;padding:6px 14px;font-weight:800;cursor:pointer}
.jump svg{width:15px;height:15px}

.totop{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);inset-inline-end:16px;z-index:8;width:48px;height:48px;border-radius:50%;border:2px solid var(--panel);background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px rgba(17,16,8,.35)}
.totop svg{width:22px;height:22px}

footer{margin-top:24px;text-align:center;font-size:.85rem;font-weight:600;color:var(--ink-2);display:grid;gap:4px}
footer b{color:var(--ink)}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <img src="icon-192.png" alt="" width="60" height="60">

        <h1 id="t-title">Fonction <i>Vitamines</i> NF</h1>

      <p class="count" id="count" aria-live="polite"></p>
    </div>
  </div>

  <main class="grid" id="grid"></main>
  <div class="empty" id="empty" hidden><span id="t-empty"></span><div class="jumps" id="jumps"></div></div>

  <footer>
    <span id="t-foot"></span>
    <span><b>Fonction Vitamines NF</b> · Nouf-Aloe · MANAGER KONOMBO</span>
  </footer>
</div>
<button class="totop" id="totop" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>

<script src="data.js"></script>
<script>
const UI={
 fr:{dir:"ltr",title:'Fonction <i>Vitamines</i> NF',sub:"Vitamines, minéraux et acides aminés : définition, sources et maladies dues au manque",
  tabs:{vit:"Vitamines",min:"Minéraux",aa:"Acides aminés"},
  intro:{
   vit:"Une <b>vitamine</b> est une substance que le corps ne fabrique pas (ou pas assez) et qu'il doit trouver dans l'alimentation, en très petite quantité, pour bien fonctionner. Il en existe <b>13</b>. Les vitamines <b>liposolubles</b> (A, D, E, K) se dissolvent dans les graisses et se stockent dans le corps. Les vitamines <b>hydrosolubles</b> (C et groupe B) se dissolvent dans l'eau et doivent être apportées chaque jour.",
   min:"Les <b>minéraux</b> sont des éléments de la terre que les plantes absorbent et que nous mangeons. Le corps ne peut pas les fabriquer. Les <b>macroéléments</b> (calcium, magnésium…) sont nécessaires en grande quantité ; les <b>oligo-éléments</b> (fer, zinc, iode…) en très petite quantité, mais ils sont tout aussi indispensables.",
   aa:"Les <b>acides aminés</b> sont les briques qui forment les protéines : muscles, peau, cheveux, enzymes, hormones et anticorps. Il en existe <b>20</b>. Le corps sait en fabriquer 11 ; les <b>9 autres, dits essentiels</b>, doivent venir de l'alimentation. Un manque prolongé de protéines provoque chez l'enfant le <b>kwashiorkor</b> (ventre gonflé, œdèmes, cheveux décolorés) ou le <b>marasme</b> (maigreur extrême)."},
  search:"Chercher une vitamine, un minéral, un aliment, une maladie…",
  all:{vit:"Toutes",min:"Tous",aa:"Tous"},
  grp:{lipo:"Liposoluble",hydro:"Hydrosoluble",macro:"Macroélément",oligo:"Oligo-élément",ess:"Essentiel"},
  grpP:{lipo:"Liposolubles",hydro:"Hydrosolubles",macro:"Macroéléments",oligo:"Oligo-éléments"},
  def:"Définition",src:"Sources",mal:"Maladies en cas de manque",
  total:{vit:n=>n+" vitamines",min:n=>n+" minéraux",aa:n=>n+" acides aminés essentiels"},
  found:n=>n+(n>1?" résultats":" résultat"),
  back:"Retour",top:"Haut de la page",install:"Installer l'application",clear:"Effacer",langs:"Langue",filters:"Filtres",
  empty:"Aucun résultat dans cet onglet.",emptyAll:"Aucun résultat pour cette recherche.",seeIn:"Voir dans",
  foot:"Informations générales sur la santé. Elles ne remplacent pas l'avis d'un médecin ou d'un pharmacien."},
 ar:{dir:"rtl",title:'وظائف <i>الفيتامينات</i> NF',sub:"الفيتامينات والمعادن والأحماض الأمينية: التعريف والمصادر والأمراض الناتجة عن نقصها",
  tabs:{vit:"الفيتامينات",min:"المعادن",aa:"الأحماض الأمينية"},
  intro:{
   vit:"<b>الفيتامين</b> مادة لا يصنعها الجسم (أو لا يصنع منها ما يكفي)، ويجب أن يحصل عليها من الغذاء بكميات صغيرة جدًا ليعمل بشكل سليم. يوجد منها <b>13</b> فيتامينًا. الفيتامينات <b>الذائبة في الدهون</b> (A وD وE وK) تُخزَّن في الجسم، أما الفيتامينات <b>الذائبة في الماء</b> (C ومجموعة B) فيجب الحصول عليها كل يوم.",
   min:"<b>المعادن</b> عناصر من الأرض تمتصها النباتات ونأكلها نحن، ولا يستطيع الجسم صنعها. <b>المعادن الكبرى</b> (الكالسيوم والمغنيسيوم…) يحتاجها الجسم بكميات كبيرة، أما <b>العناصر النزرة</b> (الحديد والزنك واليود…) فيحتاجها بكميات صغيرة جدًا، لكنها ضرورية بالقدر نفسه.",
   aa:"<b>الأحماض الأمينية</b> هي اللبنات التي تتكوّن منها البروتينات: العضلات والجلد والشعر والإنزيمات والهرمونات والأجسام المضادة. يوجد منها <b>20</b> حمضًا. يستطيع الجسم صنع 11 منها، أما <b>التسعة الباقية، وتسمّى الأساسية</b>، فيجب أن تأتي من الغذاء. النقص الطويل في البروتينات يسبّب عند الأطفال <b>الكواشيوركور</b> (انتفاخ البطن والوذمات وتغيّر لون الشعر) أو <b>السغل</b> (النحافة الشديدة)."},
  search:"ابحث عن فيتامين أو معدن أو غذاء أو مرض…",
  all:{vit:"الكل",min:"الكل",aa:"الكل"},
  grp:{lipo:"يذوب في الدهون",hydro:"يذوب في الماء",macro:"معدن كبير",oligo:"عنصر نزر",ess:"أساسي"},
  grpP:{lipo:"الذائبة في الدهون",hydro:"الذائبة في الماء",macro:"المعادن الكبرى",oligo:"العناصر النزرة"},
  def:"التعريف",src:"المصادر",mal:"الأمراض الناتجة عن النقص",
  total:{vit:n=>"عدد الفيتامينات: "+n,min:n=>"عدد المعادن: "+n,aa:n=>"عدد الأحماض الأمينية الأساسية: "+n},
  found:n=>"النتائج: "+n,
  back:"رجوع",top:"أعلى الصفحة",install:"تثبيت التطبيق",clear:"مسح",langs:"اللغة",filters:"التصفية",
  empty:"لا توجد نتائج في هذا القسم.",emptyAll:"لا توجد نتائج لهذا البحث.",seeIn:"عرض في",
  foot:"معلومات صحية عامة، ولا تُغني عن استشارة الطبيب أو الصيدلي."}
};
const GROUPS={vit:["lipo","hydro"],min:["macro","oligo"],aa:[]};

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Normalisation caractère par caractère (accents français, voyelles et formes de l'alif en arabe) */
function nc(c){
  c=c.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  c=c.replace(/[ً-ٰٟـ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[’']/g," ").replace(/œ/g,"oe");
  return c;
}
function normMap(text){let s="",map=[];for(let i=0;i<text.length;i++){const n=nc(text[i]);for(let k=0;k<n.length;k++){s+=n[k];map.push(i)}}map.push(text.length);return{s,map}}
const norm=t=>normMap(t).s;

const ICON={
 def:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.1"/></svg>',
 src:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14zM5 19l7-7"/></svg>',
 mal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20zM12 10v4M12 17v.1"/></svg>',
 go:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
};
const STOP=new Set(["vitamine","vitamines","vit","mineral","mineraux","acide","acides","amine","amines","la","le","de","des","du","les","et","فيتامين","فيتامينات","حمض","احماض","اميني","امينيه","و","في"]);

/* Index de recherche : les deux langues */
DATA.forEach(d=>{
  const parts=[d.id,"vitamine "+d.id];
  ["fr","ar"].forEach(l=>{const x=d[l];parts.push(x.name,x.chem,x.def,x.src.join(" "),x.mal.flat().join(" "),x.note||"",UI[l].grp[d.grp])});
  d._txt=" "+norm(parts.join(" ")).replace(/[,.;:()«»"!?،؛]/g," ")+" ";
  d._id=norm(d.id);
});

let LANG="fr",TAB="vit",FILTER="all",QUERY="",DEPTH=0;
try{const p=new URLSearchParams(location.search).get("lang")||localStorage.getItem("vitnf-lang");if(UI[p])LANG=p}catch(e){}
const U=()=>UI[LANG];

function terms(){return norm(QUERY).split(/\s+/).filter(t=>t&&!STOP.has(t))}
function matches(d,ts){
  return ts.every(t=>{
    if(/^(b?\d{1,2}|[a-z]{1,2})$/.test(t)) return d._id===t||d._id==="b"+t||d._txt.includes(" "+t+" ");
    return d._txt.includes(t);
  });
}
function hl(text,ts){
  if(!ts.length) return esc(text);
  const {s,map}=normMap(text); const marks=[];
  ts.filter(t=>t.length>1).forEach(t=>{let i=s.indexOf(t);while(i>-1){marks.push([map[i],map[i+t.length-1]+1]);i=s.indexOf(t,i+t.length)}});
  if(!marks.length) return esc(text);
  marks.sort((a,b)=>a[0]-b[0]);
  let r="",pos=0;
  for(const [a,b] of marks){if(a<pos)continue;r+=esc(text.slice(pos,a))+"<mark>"+esc(text.slice(a,b))+"</mark>";pos=b}
  return r+esc(text.slice(pos));
}

function card(d,ts){
  const x=d[LANG],u=U();
  const bc=d.id.length>=3?" l":d.id.length===2?" m":"";
  return `<article class="item" data-cat="${d.cat}" id="i-${d.cat}-${d.id}" lang="${LANG}">
    <div class="ihead">
      <div class="badge${bc}" aria-hidden="true" dir="ltr">${d.id}</div>
      <div>
        <h2>${hl(x.name,ts)}</h2>
        <p class="chem">${hl(x.chem,ts)}</p>
        <span class="type ${d.grp}">${u.grp[d.grp]}</span>
      </div>
    </div>
    <div class="ibody">
      <section><h3>${ICON.def}${u.def}</h3><p>${hl(x.def,ts)}</p></section>
      <section><h3>${ICON.src}${u.src}</h3><ul class="tags">${x.src.map(s=>`<li>${hl(s,ts)}</li>`).join("")}</ul></section>
      <section><h3>${ICON.mal}${u.mal}</h3><ul class="ill">${x.mal.map(([m,dd])=>`<li><b>${hl(m,ts)}</b>${dd?(LANG==="ar"?"، ":" : ")+hl(dd,ts):""}</li>`).join("")}</ul></section>
      ${x.note?`<p class="note">${hl(x.note,ts)}</p>`:""}
    </div>
  </article>`;
}

function renderChips(){
  const u=U(); const list=DATA.filter(d=>d.cat===TAB);
  let h=`<button type="button" data-f="all" aria-pressed="${FILTER==="all"}">${u.all[TAB]}</button>`;
  GROUPS[TAB].forEach(g=>{h+=`<button type="button" data-f="${g}" aria-pressed="${FILTER===g}">${u.grpP[g]}</button>`});
  h+='<span class="sep"></span>';
  list.forEach(d=>{const lbl=TAB==="vit"?d.id:d[LANG].name;h+=`<button type="button" data-f="${d.id}" aria-pressed="${FILTER===d.id}">${esc(lbl)}</button>`});
  $("chips").innerHTML=h; $("chips").setAttribute("aria-label",u.filters);
}

function render(){
  const u=U(), ts=terms();
  const byCat={vit:[],min:[],aa:[]};
  DATA.forEach(d=>{if(!ts.length||matches(d,ts))byCat[d.cat].push(d)});
  // onglets
  document.querySelectorAll("#tabs button").forEach(b=>{
    const t=b.dataset.tab; b.setAttribute("aria-selected",t===TAB);
    b.querySelector(".lbl").textContent=u.tabs[t];
    const n=b.querySelector(".n"); const tot=DATA.filter(d=>d.cat===t).length;
    n.textContent=ts.length?byCat[t].length:tot; n.classList.toggle("hit",ts.length>0&&byCat[t].length>0);
  });
  let list=byCat[TAB];
  if(FILTER!=="all") list=list.filter(d=>d.grp===FILTER||d.id===FILTER);
  $("grid").innerHTML=list.map(d=>card(d,ts)).join("");
  // vide
  $("empty").hidden=list.length>0;
  if(!list.length){
    const others=["vit","min","aa"].filter(t=>t!==TAB&&byCat[t].length);
    $("t-empty").textContent=others.length?u.empty:u.emptyAll;
    $("jumps").innerHTML=others.map(t=>`<button class="jump" type="button" data-go="${t}">${u.seeIn} ${u.tabs[t]} (${byCat[t].length})${ICON.go}</button>`).join("");
    if(FILTER!=="all"&&byCat[TAB].length) $("t-empty").textContent=u.emptyAll;
  }
  const total=DATA.filter(d=>d.cat===TAB).length;
  $("count").textContent=(!ts.length&&FILTER==="all")?u.total[TAB](total):u.found(list.length);
  $("back").hidden=!(QUERY||FILTER!=="all"||DEPTH>0);
}

function applyLang(){
  const u=U(),h=document.documentElement;
  h.lang=LANG; h.dir=u.dir;
  document.title=LANG==="ar"?"وظائف الفيتامينات NF":"Fonction Vitamines NF";
  $("t-title").innerHTML=u.title; $("t-sub").textContent=u.sub;
  $("intro").innerHTML=u.intro[TAB]; $("q").placeholder=u.search;
  $("t-back").textContent=u.back; $("t-install").textContent=u.install; $("t-foot").textContent=u.foot;
  $("clear").setAttribute("aria-label",u.clear); $("totop").setAttribute("aria-label",u.top); $("langs").setAttribute("aria-label",u.langs);
  document.querySelectorAll("#langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  renderChips(); render();
}

/* Navigation : onglet et filtre gardés dans l'historique (bouton retour du téléphone) */
function setView(tab,filter,push){
  const changedTab=tab!==TAB;
  TAB=tab; FILTER=filter;
  if(push){DEPTH++;history.pushState({tab,filter,d:DEPTH},"","#"+tab+(filter!=="all"?"-"+filter:""))}
  $("intro").innerHTML=U().intro[TAB];
  renderChips(); render();
  if(changedTab) window.scrollTo({top:0,behavior:"smooth"});
  else if(filter!=="all") $("tabs").scrollIntoView({behavior:"smooth",block:"start"});
}
window.addEventListener("popstate",e=>{
  const s=e.state||{tab:"vit",filter:"all",d:0};
  DEPTH=s.d||0; setView(s.tab,s.filter,false);
});

$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.dataset.tab===TAB)return;setView(b.dataset.tab,"all",true)});
$("chips").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  const f=b.dataset.f; if(f===FILTER)return;
  setView(TAB,f,true);
});
$("jumps").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setView(b.dataset.go,"all",true)});
$("back").addEventListener("click",()=>{
  if(QUERY){$("q").value="";QUERY="";$("clear").hidden=true;if(FILTER==="all"){render();return}}
  if(DEPTH>0){history.back();return}
  setView(TAB,"all",false);
});
$("q").addEventListener("input",e=>{QUERY=e.target.value;$("clear").hidden=!QUERY;render()});
$("clear").addEventListener("click",()=>{$("q").value="";QUERY="";$("clear").hidden=true;render();$("q").focus()});
$("langs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||b.dataset.lang===LANG)return;
  LANG=b.dataset.lang; try{localStorage.setItem("vitnf-lang",LANG)}catch(err){}
  applyLang();
});
$("totop").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
window.addEventListener("scroll",()=>{$("totop").hidden=window.scrollY<600},{passive:true});

/* Démarrage : lire l'onglet dans l'adresse (#min, #aa-Lys…) */
(function(){
  const m=location.hash.slice(1).match(/^(vit|min|aa)(?:-(\w+))?$/);
  if(m){TAB=m[1];FILTER=m[2]||"all";if(FILTER!=="all"&&!GROUPS[TAB].includes(FILTER)&&!DATA.some(d=>d.cat===TAB&&d.id===FILTER))FILTER="all"}
  history.replaceState({tab:TAB,filter:FILTER,d:0},"");
  applyLang();
})();

/* Installation et hors connexion */
let deferred=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("install").hidden=false});
$("install").addEventListener("click",async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("install").hidden=true});
window.addEventListener("appinstalled",()=>{$("install").hidden=true});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
